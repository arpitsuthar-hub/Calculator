<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="U3lDtwb4mbqDxVHL30SxO2_naUFMF6ajV61lhLt-Svo" />

    <!-- SEO -->
    <title>Modern Calculator - VERCAL</title>

    <meta name="description"
        content="Modern Calculator by VERCAL - a free, fast and easy online calculator for everyday calculations.">

    <meta name="keywords"
        content="Modern Calculator, online calculator, free calculator, VERCAL calculator, web calculator">

    <meta name="author" content="VERCAL">

    <!-- Search engines -->
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://arpitsuthar-hub.github.io/Calculator/">

    <!-- Open Graph -->
    <meta property="og:title" content="Modern Calculator - VERCAL">
    <meta property="og:description"
        content="A free, fast and easy Modern Calculator by VERCAL.">
    <meta property="og:type" content="website">
    <meta property="og:url"
        content="https://arpitsuthar-hub.github.io/Calculator/">

    <!-- Website structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Modern Calculator",
        "alternateName": "VERCAL",
        "url": "https://arpitsuthar-hub.github.io/Calculator/",
        "description": "A free, fast and easy online Modern Calculator by VERCAL.",
        "applicationCategory": "CalculatorApplication",
        "operatingSystem": "Any"
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator Header -->
        <div class="calculator-header">
            <div>
                <h1>Modern Calculator</h1>
                <span>Simple • Fast • Smart</span>
            </div>

            <div class="calculator-icon">
                +
            </div>
        </div>


        <!-- Display -->
        <div class="display-container">

            <div class="display-history">
                0
            </div>

            <input
                type="text"
                id="inputbox"
                placeholder="0"
                readonly
                aria-label="Calculator display"
            >

        </div>


        <!-- Calculator Buttons -->

        <div class="buttons">

            <button class="function">AC</button>
            <button class="function">DEL</button>
            <button class="function">%</button>
            <button class="operator">÷</button>


            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>


            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>


            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>


            <button class="zero">00</button>
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
