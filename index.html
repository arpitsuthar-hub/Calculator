<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator Header -->
        <div class="calculator-header">
            <div>
                <h2>Calculator</h2>
                <span>Simple • Fast • Smart</span>
            </div>

            <div class="calculator-icon">
                +
            </div>
        </div>


        <!-- Display -->
        <div class="display-container">

            <div class="display-history">
                0
            </div>

            <input
                type="text"
                id="inputbox"
                placeholder="0"
                readonly
            >

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button class="function">AC</button>
            <button class="function">DEL</button>
            <button class="function">%</button>
            <button class="operator">÷</button>


            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>


            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>


            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>


            <button class="zero">00</button>
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
